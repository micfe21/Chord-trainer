<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chord Trainer – v13 (Modulating fixed)</title>
    <style>
        /* ─── same as v13 ─── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            background: #f5f2ed;
            min-height: 100dvh;
            padding: 12px;
            color: #1f1c18;
            display: flex;
            justify-content: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .app {
            max-width: 820px;
            width: 100%;
            background: #fbfaf7;
            border-radius: 28px;
            padding: 18px 16px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.04);
        }
        /* ... rest of CSS identical to v13 ... */
        /* For brevity, I'm not repeating the full CSS here – it's the same as v13 */
        /* But I will include the complete file in the final answer */
    </style>
</head>
<body>
    <!-- ... same HTML as v13 ... -->
    <div class="header">
        <h1>🎵 <span>Chord</span> Trainer</h1>
        <div class="top-controls">
            <select id="keySelect"><option value="60">C</option></select>
            <select id="modeSelect">
                <option value="roman">Roman</option>
                <option value="absolute">Absolute</option>
                <option value="mixed">Mixed</option>
            </select>
            <!-- KEY MODE SELECTOR (restored) -->
            <select id="keyModeSelect">
                <option value="fixed">Fixed</option>
                <option value="modulating">Modulating</option>
            </select>
            <select id="lengthSelect">
                <option value="4">4</option>
                <option value="6" selected>6</option>
                <option value="8">8</option>
                <option value="10">10</option>
            </select>
            <select id="chordTypeSelect">
                <option value="triad">Triads</option>
                <option value="seventh">Sevenths</option>
                <option value="all" selected>Both</option>
            </select>
            <button id="voiceLeadingBtn" class="voice-leading">🎹 Voice Leading</button>
            <button id="generateBtn">Generate</button>
            <button id="randomBtn" class="secondary">🎲</button>
        </div>
    </div>

    <!-- ... rest of UI same as v13 ... -->

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // THEORY ENGINE (identical to v13)
        // ═══════════════════════════════════════════════════════════════════════

        // ... (all theory code from v13 is unchanged)

        // ═══════════════════════════════════════════════════════════════════════
        // IMPROVED AUDIO ENGINE (same as v13)
        // ═══════════════════════════════════════════════════════════════════════

        // ... (all audio code from v13 is unchanged)

        // ═══════════════════════════════════════════════════════════════════════
        // GENERATE FUNCTION – FIXED
        // ═══════════════════════════════════════════════════════════════════════

        function generate() {
            const key = keySelect.value;
            const length = parseInt(lengthSelect.value, 10) || 6;
            // ─── FIX: use the selected key mode ───
            const keyMode = document.getElementById('keyModeSelect').value;  // <-- was hardcoded to 'fixed'
            const invMode = currentInversionMode;

            let seq;
            if (currentMode === 'roman') {
                seq = generateSequence(key, length, currentFilter, keyMode, invMode);
            } else if (currentMode === 'absolute') {
                seq = generateAbsoluteSequence(length, currentFilter, invMode);
            } else {
                seq = generateMixedSequence(key, length, currentFilter, keyMode, invMode);
            }

            currentSequence = seq;
            renderSequence(seq);
            stopPlayback();
            currentIndex = 0;
            setCurrentChord(0);
            stats = { correct: 0, wrong: 0, streak: 0, bestStreak: 0, total: 0, times: [] };
            updateStats();
            feedbackMsg.textContent = `🎯 Play: ${currentTargetDisplay}`;
            feedbackMsg.className = 'feedback-msg waiting';
            listenMode = true;
        }

        // ═══════════════════════════════════════════════════════════════════════
        // REST OF CODE (state, piano, MIDI, UI) – identical to v13
        // ═══════════════════════════════════════════════════════════════════════

        // ... (all the rest of the code from v13 is unchanged)

        // Make sure the Key Mode selector is visible in Roman/Mixed modes
        // This is already handled in the mode selector event listener.
        // I'll add it here for completeness.

        // Populate key mode select visibility
        document.querySelectorAll('#modeSelector button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#modeSelector button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                const showKey = currentMode === 'roman' || currentMode === 'mixed';
                keySelect.parentElement.style.display = showKey ? 'flex' : 'none';
                document.getElementById('keyModeSelect').parentElement.style.display = showKey ? 'flex' : 'none';
                document.getElementById('keyDisplay').textContent = showKey ? `Key: ${noteLabel(parseInt(keySelect.value))}` : 'Key: none';
                generate();
            });
        });

        // Ensure keyModeSelect is accessible
        const keyModeSelect = document.getElementById('keyModeSelect');
        // ... and all the other event listeners as in v13

        console.log('🎵 Chord Trainer v13 – Modulating mode restored.');
    </script>
</body>
</html>
