<!DOCTYPE html>
<html>
<head>
  <title>MIDI Test</title>
</head>
<body>
  <h1>MIDI Test</h1>
  <button id="connectBtn">Connect MIDI</button>
  <pre id="log">Waiting...</pre>

  <script>
    const log = document.getElementById('log');
    const connectBtn = document.getElementById('connectBtn');

    connectBtn.addEventListener('click', async () => {
      try {
        log.textContent = 'Requesting MIDI access...';
        const access = await navigator.requestMIDIAccess();
        log.textContent = 'MIDI access granted!\n\nInputs:';

        // Method 1: Try to get inputs as an array using Array.from
        try {
          const inputsArray = Array.from(access.inputs);
          if (inputsArray.length === 0) {
            log.textContent += '\n❌ No MIDI inputs found (Array.from).';
          } else {
            inputsArray.forEach(([id, input]) => {
              log.textContent += `\n✅ ${input.name} (${input.manufacturer || 'unknown'})`;
              input.onmidimessage = (event) => {
                const [status, note, velocity] = event.data;
                log.textContent += `\n📩 Note: ${note} (${status === 144 ? 'ON' : 'OFF'})`;
              };
            });
          }
        } catch (e) {
          log.textContent += `\n⚠️ Array.from failed: ${e.message}`;
        }

        // Method 2: Try to get inputs using values() and a for...of loop
        try {
          log.textContent += '\n\nTrying values() method...';
          const inputsIterator = access.inputs.values();
          let hasInputs = false;
          let next = inputsIterator.next();
          while (!next.done) {
            hasInputs = true;
            const input = next.value;
            log.textContent += `\n✅ ${input.name} (${input.manufacturer || 'unknown'})`;
            input.onmidimessage = (event) => {
              const [status, note, velocity] = event.data;
              log.textContent += `\n📩 Note: ${note} (${status === 144 ? 'ON' : 'OFF'})`;
            };
            next = inputsIterator.next();
          }
          if (!hasInputs) {
            log.textContent += '\n❌ No MIDI inputs found (values).';
          }
        } catch (e) {
          log.textContent += `\n⚠️ values() failed: ${e.message}`;
        }

        // Method 3: Try a different approach – using the raw MIDI access
        try {
          log.textContent += '\n\nTrying direct MIDI access...';
          const inputs = access.inputs;
          for (let key in inputs) {
            if (inputs.hasOwnProperty(key) && !isNaN(key)) {
              const input = inputs[key];
              log.textContent += `\n✅ ${input.name} (${input.manufacturer || 'unknown'})`;
              input.onmidimessage = (event) => {
                const [status, note, velocity] = event.data;
                log.textContent += `\n📩 Note: ${note} (${status === 144 ? 'ON' : 'OFF'})`;
              };
            }
          }
        } catch (e) {
          log.textContent += `\n⚠️ Direct access failed: ${e.message}`;
        }

        log.textContent += '\n\nOutputs:';
        try {
          const outputsArray = Array.from(access.outputs);
          if (outputsArray.length === 0) {
            log.textContent += '\n❌ No MIDI outputs found.';
          } else {
            outputsArray.forEach(([id, output]) => {
              log.textContent += `\n✅ ${output.name}`;
            });
          }
        } catch (e) {
          log.textContent += `\n⚠️ Outputs failed: ${e.message}`;
        }

      } catch (error) {
        log.textContent = `❌ Error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
